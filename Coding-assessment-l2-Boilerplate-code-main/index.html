<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Cart Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">ShopLogo</div>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Shop</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="#" class="cart-icon">Cart</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="cart">
            <h1>Shopping Cart</h1>
            <div id="cart-list" class="cart-items"></div>
            <div class="cart-totals">
                <p>Subtotal: <span id="subtotal">₹0.00</span></p>
                <p>Total: <span id="total">₹0.00</span></p>
                <button id="checkout-btn">Check Out</button>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 ShopLogo. All Rights Reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
